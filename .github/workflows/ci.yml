name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'fixtures/next-app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Build library
        run: bun run build

      - name: Run unit tests
        run: bun run test:unit

      - name: Run Storybook browser tests
        run: bun run test:stories

      - name: Build Storybook
        run: bun run build-storybook

      - name: Verify packed exports
        run: bun run test:package

      - name: Check bundle-size budget
        run: bun run check:bundle-size

      - name: Build and smoke-test packed Next.js fixture
        run: bun run test:next-fixture

      - name: Check diff whitespace
        run: git diff --check
